# Render Blueprint — deploys this bot as a free web service.
# In the Render dashboard: New + -> Blueprint -> pick this repo.
# Secret values (tokens/keys) are marked sync:false, so Render asks you to
# type them in the dashboard instead of committing them to git.
services:
  - type: web
    name: ai-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # 1 worker keeps the per-sender lock, dedup cache, and in-memory state
    # global; threads give concurrency across different senders.
    startCommand: gunicorn app:app --workers 1 --threads 8 --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: VERIFY_TOKEN
        sync: false
      - key: PAGE_ACCESS_TOKEN
        sync: false
      - key: APP_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: LLM_PROVIDER
        value: auto
      # Free cloud DB (Turso) so data persists across deploys. Set both.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Optional team tools (leave unset to disable).
      - key: ADMIN_TOKEN
        sync: false
      - key: ADMIN_WEBHOOK_URL
        sync: false
